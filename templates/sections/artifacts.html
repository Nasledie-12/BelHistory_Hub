<section id="artifacts" class="py-24 bg-white">
    <div class="container mx-auto px-4">
        <div class="text-center mb-16">
            <h2 class="text-4xl font-extrabold text-slate-900 mb-4">Ключевые артефакты</h2>
            <p class="mx-auto max-w-2xl text-slate-500">
                Здесь показаны только реликвии, святыни и культурные ценности, без замков, крепостей и музейных локаций.
            </p>
            <div class="w-24 h-1 bg-red-500 mx-auto"></div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-10">
            {% for object in featured_objects %}
            <div class="bg-white rounded-3xl overflow-hidden shadow-sm hover:shadow-2xl transition duration-500 border border-gray-100 flex flex-col group">
                <div class="relative overflow-hidden aspect-video">
                    <img src="{{ url_for('static', filename='img/' + object.image_url) }}" alt="{{ object.name }} - исторический объект Беларуси" class="w-full h-full object-cover group-hover:scale-110 transition duration-700">
                    <div class="absolute top-4 left-4 bg-white/90 backdrop-blur-sm px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider text-slate-600">
                        {{ object.category.name }}
                    </div>
                </div>
                <div class="p-8 flex-grow">
                    <div class="text-red-500 mb-3"><i class="fas fa-gem text-2xl"></i></div>
                    <h3 class="text-xl font-bold mb-4 text-slate-900">{{ object.name }}</h3>
                    <p class="text-slate-500 text-sm leading-relaxed mb-6">
                        {{ object.description|truncate(150) }}
                    </p>
                    <a href="{{ url_for('object_detail', id=object.id) }}" class="inline-flex items-center text-red-500 font-bold text-sm hover:text-red-600 transition">
                        Изучить <i class="fas fa-chevron-right ml-2 text-[10px]"></i>
                    </a>
                </div>
            </div>
            {% endfor %}
        </div>
        <div class="mt-12 text-center">
            <a href="{{ url_for('treasures') }}" class="inline-flex items-center rounded-2xl accent-red px-8 py-4 text-sm font-bold text-white accent-red-hover transition shadow-lg">
                Все сокровища и артефакты
            </a>
        </div>
    </div>
</section>
