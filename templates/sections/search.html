<section id="search" class="py-12 bg-white">
    <div class="container mx-auto px-4 -mt-12 relative z-10">
        <form action="{{ url_for('treasures') }}" method="GET" class="bg-white p-8 rounded-2xl shadow-xl border border-gray-100 grid grid-cols-1 md:grid-cols-5 gap-6">
            <div class="col-span-1 md:col-span-1">
                <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Ключевое слово</label>
                <div class="relative">
                    <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-300"></i>
                    <input type="text" name="keyword" placeholder="Введите название..." class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-transparent rounded-xl text-sm focus:bg-white focus:border-red-400 transition outline-none">
                </div>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Категория</label>
                <select name="category_id" class="w-full px-4 py-3 bg-slate-50 border border-transparent rounded-xl text-sm focus:bg-white focus:border-red-400 transition outline-none appearance-none">
                    <option>Все категории</option>
                    {% for cat in categories %}
                        <option value="{{ cat.id }}">{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Регион</label>
                <select name="region_id" class="w-full px-4 py-3 bg-slate-50 border border-transparent rounded-xl text-sm focus:bg-white focus:border-red-400 transition outline-none appearance-none">
                    <option>Все регионы</option>
                    {% for reg in regions %}
                        <option value="{{ reg.id }}">{{ reg.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="flex space-x-2">
                <div class="w-1/2">
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-2">С года</label>
                    <input type="number" name="year_from" placeholder="ГГГГ" class="w-full px-4 py-3 bg-slate-50 border border-transparent rounded-xl text-sm focus:bg-white focus:border-red-400 transition outline-none">
                </div>
                <div class="w-1/2">
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-2">По год</label>
                    <input type="number" name="year_to" placeholder="ГГГГ" class="w-full px-4 py-3 bg-slate-50 border border-transparent rounded-xl text-sm focus:bg-white focus:border-red-400 transition outline-none">
                </div>
            </div>
            <div class="flex items-end">
                <button type="submit" class="w-full accent-red text-white py-3 rounded-xl font-bold accent-red-hover transition shadow-md">
                    Найти сокровища
                </button>
            </div>
        </form>
        <div class="mt-4 flex justify-end">
            <a href="{{ url_for('treasures') }}" class="inline-flex items-center text-sm font-bold text-red-500 transition hover:text-red-600">
                Открыть отдельную страницу каталога <i class="fas fa-chevron-right ml-2 text-[10px]"></i>
            </a>
        </div>
    </div>
</section>
